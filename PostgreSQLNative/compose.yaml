services:
  postgres-source:
    image: postgres:17
    container_name: epr-postgres-source
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source_db
    ports:
      - "15432:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./:/spike:ro

  postgres-read:
    image: postgres:17
    container_name: epr-postgres-read
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: read_db
    ports:
      - "15433:5432"
    volumes:
      - read-data:/var/lib/postgresql/data
      - ./:/spike:ro

volumes:
  source-data:
  read-data:
